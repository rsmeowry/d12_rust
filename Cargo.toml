[package]
name = "d12-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
flume = "0.12.0"
glam = { version = "0.33.9", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
num_enum = "0.7.6"
image = { version = "0.25.10", features = ["png", "jpeg", "hdr"] }
asset-importer = { version = "0.8.0", features = ["glam", "static-link"]}
rand = "0.10.3"
walkdir = "2.5.0"
rapidhash = "4.5.1"
skip_bom = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
font8x8 = "0.3.1"
bitflags = "2.13.2"
egui = { version = "0.36", features = ["bytemuck", "default_fonts"] }
egui-probe = { version = "0.13.0", features = ["derive"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_Graphics_Direct3D_Fxc"
]

[profile.dev.package.image]
opt-level = 3
